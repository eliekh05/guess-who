<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guess Who?</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    .container {
      text-align: center;
      max-width: 480px;
      padding: 2rem;
    }
    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
    p { color: #a0a0a0; margin-bottom: 1.5rem; }
    a {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #e94560;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.2s;
    }
    a:hover { background: #c73e54; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Guess Who?</h1>
    <p>This is the frontend emergency fallback. The main game is served from the backend worker.</p>
    <a href="/">Play the Game</a>
  </div>
</body>
</html>
